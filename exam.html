
<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ujian CBT – Ujian</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="header">
        <div class="title" id="examHeader">Ujian CBT</div>
        <div class="badge timer" id="timer">--:--</div>
      </div>

      <div class="progress"><div id="progressBar"></div></div>
      <div class="small" id="meta">Memuat…</div>
      <hr>

      <div id="questionArea">Memuat soal…</div>

      <hr>
      <div style="display:flex;gap:8px;justify-content:space-between">
        <div style="display:flex;gap:8px">
          <button class="btn secondary" id="prevBtn">← Sebelumnya</button>
          <button class="btn secondary" id="nextBtn">Berikutnya →</button>
        </div>
        <div>
          <button class="btn" id="submitBtn">Kumpulkan Jawaban ✓</button>
        </div>
      </div>

      <div class="footer">
        Navigasi cepat: <span class="kbd">Alt</span> + <span class="kbd">←/→</span>. – Simpan otomatis di perangkat Anda.
      </div>
    </div>
  </div>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/exam.js"></script>
</body>
</html>
